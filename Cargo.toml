[package]
name = "snippy2"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34.3", features = ["wgpu"] }
egui = "0.34.3"
wgpu = { version = "29.0.3" }
wgpu-hal = { version = "29.0.3" }
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3.2"
core-video-sys = { version = "0.1.4", default-features = false, features = ["io_suface"] }
core-foundation-sys = { version = "0.8.7" }
ffmpeg-next = "8.1.0"
cpal = "0.17.3"
ringbuf = "0.5.0"
crossbeam-channel = "0.5.15"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
lru = "0.12"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
rfd = "0.17.2"
pollster = "0.4.0"

# Workaround for macOS strict Objective-C type checking panic in winit/objc2
[profile.dev.package.objc2]
debug-assertions = false

[profile.dev.package.objc2-foundation]
debug-assertions = false

# Optimize all dependencies in dev mode for smooth real-time video playback and scrubbing
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15.0", features = ["flamegraph", "frame-pointer"] }

